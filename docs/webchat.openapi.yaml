openapi: 3.1.0
info:
  title: XStoryBot Webchat API
  version: 1.0.0
  description: 署名付きclient stateを使う同期Webchat API。
paths:
  /api/webchat/v1/bots/{bot}/turn:
    options:
      summary: CORS preflight
      parameters:
        - $ref: '#/components/parameters/Bot'
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: 許可済みorigin
        '403':
          $ref: '#/components/responses/Problem'
    post:
      summary: 会話またはLIFF用Botを1 turn進める
      parameters:
        - $ref: '#/components/parameters/Bot'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
      responses:
        '200':
          description: 次stateと表示message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          description: providerがrequest上限超過を直接返す場合がある
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          description: API Gatewayがrate limitを直接返す場合がある
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '502':
          description: proxyまたは外部HTTPのgateway error。非JSONの場合がある
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: proxyまたは外部HTTPのtimeout。非JSONの場合がある
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    Bot:
      name: bot
      in: path
      required: true
      schema:
        type: string
        pattern: '^[-_a-zA-Z0-9]+$'
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: Bot設定のHTTPS origin allowlistと完全一致させる。
  responses:
    Problem:
      description: 固定codeを持つproblem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    TurnRequest:
      type: object
      required: [input]
      properties:
        state_token:
          type: string
          description: start以外で必須。opaqueな署名token。
        input:
          oneOf:
            - $ref: '#/components/schemas/StartInput'
            - $ref: '#/components/schemas/TextInput'
            - $ref: '#/components/schemas/PostbackInput'
            - $ref: '#/components/schemas/LiffInput'
            - $ref: '#/components/schemas/MenuInput'
      additionalProperties: false
      allOf:
        - if:
            properties:
              input:
                properties:
                  type:
                    const: start
                required: [type]
          then:
            not:
              required: [state_token]
          else:
            required: [state_token]
    StartInput:
      type: object
      required: [type]
      properties:
        type:
          const: start
      additionalProperties: false
    TextInput:
      type: object
      required: [type, text]
      properties:
        type:
          const: text
        text:
          type: string
      additionalProperties: false
    PostbackInput:
      type: object
      required: [type, postback_token]
      properties:
        type:
          const: postback
        postback_token:
          type: string
      additionalProperties: false
    LiffInput:
      type: object
      required: [type, app, app_url, action]
      properties:
        type:
          const: liff
        app:
          type: string
          description: 登録されたLIFFページの識別子。
        app_url:
          type: string
          format: uri
          description: liff_appsで受け取ったURL。設定変更後の古いページを拒否するために照合する。
        action:
          type: string
          description: LIFF用Botのaction_prefixを除いた内部action。
      additionalProperties: false
    MenuInput:
      type: object
      required: [type, menu, revision, area]
      properties:
        type: {const: menu}
        menu: {type: string}
        revision: {type: string}
        area: {type: integer, minimum: 0}
      additionalProperties: false
    Richmenu:
      type: object
      required: [id, revision, chat_bar_text, selected, image_url, width, height, areas]
      properties:
        id: {type: string}
        revision: {type: string}
        chat_bar_text: {type: string}
        selected: {type: boolean}
        image_url: {type: string, format: uri}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        areas:
          type: array
          items:
            type: object
            required: [x, y, width, height, action]
            properties:
              x: {type: integer, minimum: 0}
              y: {type: integer, minimum: 0}
              width: {type: integer, minimum: 1}
              height: {type: integer, minimum: 1}
              action:
                oneOf:
                  - type: object
                    required: [type, label, echo_text]
                    properties:
                      type: {const: menu}
                      label: {type: string}
                      echo_text: {type: [string, 'null']}
                    additionalProperties: false
                  - type: object
                    required: [type, label, href]
                    properties:
                      type: {const: uri}
                      label: {type: string}
                      href: {type: string, format: uri}
                    additionalProperties: false
            additionalProperties: false
      additionalProperties: false
    TurnResponse:
      type: object
      required: [schema_version, request_id, state, state_token, echo_message, messages]
      properties:
        schema_version:
          const: 1
        request_id:
          type: string
        state:
          type: object
          required: [id, revision]
          properties:
            id:
              type: string
              pattern: '^[0-9a-f]{64}$'
            revision:
              type: integer
          additionalProperties: false
        state_token:
          type: string
        echo_message:
          type: [string, 'null']
        messages:
          type: array
          items:
            $ref: './webchat-message-spec.schema.json'
        richmenu:
          anyOf:
            - $ref: '#/components/schemas/Richmenu'
            - type: 'null'
        menu_updated:
          type: boolean
          description: trueなら古いメニュー操作は実行せず、state_tokenを維持して表示だけ更新した。自動再送しない。
        chat_updated:
          type: boolean
          description: falseなら会話履歴とactiveResponseを維持し、セーブだけ更新する。省略時はtrue。
        active_message_ids:
          type: array
          description: messagesのうち最新の会話応答に含めるID。空配列なら選択肢を解除し、省略時はmessages全件を使う。
          items:
            type: string
        liff_result:
          type: array
          description: LIFF操作のイベント列。要素は変換しない。
          items: {}
        liff_apps:
          type: array
          items:
            type: object
            required: [id, url]
            properties:
              id:
                type: string
              url:
                type: string
                format: uri
              match:
                type: string
                enum: [exact, prefix]
              liff_id:
                type: string
            additionalProperties: false
      additionalProperties: false
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type:
          const: about:blank
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - internal-error
            - service-unavailable
            - invalid-state
            - incompatible-state
            - action-not-active
            - bot-not-web-compatible
            - bot-response-too-large
            - turn-timeout
            - external-http-error
            - external-http-timeout
            - invalid-origin
            - invalid-request
            - unsupported-media-type
            - unsupported-input
        request_id:
          type: string
      additionalProperties: false
